# Composite GitHub Action. Field set verified against
# https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions
# (composite actions: name/description/runs required, every run step needs an
# explicit shell, inputs are read via the inputs context).
#
# Version pinning design: the CLI is fetched with "npm install -g
# residoo@VERSION" rather than run from the checked-out action tree, so the
# workflow runs the exact bits published to npm, the same command a
# developer runs locally. The action tag and the CLI version move together:
# dandovdub/residoo@v0.4.11 defaults to residoo 0.4.11 on npm. Override the
# version input only if you need to split them.
#
# "npm install -g", not "npx --yes": verified directly in a real GitHub
# Actions run (ubuntu-latest, actions/setup-node@v4's Node 20, npm 10.8.2)
# that "npx --yes residoo@VERSION ..." fails there with "residoo: not
# found" (exit 127), even though the registry is fully reachable (npm view
# succeeds) and "npm install -g residoo@VERSION" followed by a direct
# invocation works every time. npm exec's install-then-run resolution did
# not trigger the install in that environment; the cause was not narrowed
# further because "npm install -g" is unconditionally reliable and needs no
# further chase. Confirmed as a real, reproducible failure of npx itself,
# not a transient network blip: it failed identically across three separate
# live runs before this fix.
#
# The npm fetch is distribution, not scanning: the scan itself makes zero
# network calls and modifies nothing on disk.
name: residoo scan
description: >-
  Scan a repository checkout for committed AI agent session artifacts that
  leak secrets, and for repo-level planted persistence. Read-only, redacted
  output, zero network calls in the scan itself.
author: CloudRoam
branding:
  icon: shield
  color: purple

inputs:
  fail-on-find:
    description: >-
      Fail the job (exit code 1) when the scan reports a secret finding or an
      integrity warning. Info-level review items do not fail the job. Set to
      "false" to report without failing.
    required: false
    default: "true"
  project-dir:
    description: >-
      Directory to scan, relative to the workspace. This is the repository
      checkout, so run actions/checkout before this action.
    required: false
    default: "."
  version:
    description: >-
      residoo version to fetch from npm. Defaults to the release this action
      tag ships with; the tag and the CLI version move together.
    required: false
    default: "0.4.11"
  sarif:
    description: >-
      Also produce SARIF output and upload it to GitHub code scanning's
      Security tab via github/codeql-action/upload-sarif, so findings show
      up as native code-scanning alerts and inline PR annotations. Off by
      default: the calling workflow's job needs "permissions:
      security-events: write" for the upload step to succeed (residoo's own
      scan itself needs no permissions and makes no network calls beyond
      fetching the npm package), so this is opt in rather than assumed.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install residoo
      shell: bash
      env:
        RESIDOO_VERSION: ${{ inputs.version }}
      run: npm install -g "residoo@$RESIDOO_VERSION"
    - name: Run residoo project scan
      id: residoo
      shell: bash
      # continue-on-error, not "set -e" straight through to the job: a
      # --fail-on-find exit must still fail the JOB (see the final step
      # below, which re-applies the captured code), but it must not skip
      # the SARIF upload steps that follow it — a finding is exactly the
      # case where seeing it land on the Security tab matters most.
      continue-on-error: true
      # Inputs cross into the step as environment variables instead of being
      # interpolated into the script body, so a hostile value in a caller's
      # workflow expression cannot inject shell syntax into this run block.
      env:
        RESIDOO_PROJECT_DIR: ${{ inputs.project-dir }}
        RESIDOO_FAIL_ON_FIND: ${{ inputs.fail-on-find }}
      run: |
        set -uo pipefail
        args=(scan --project "$RESIDOO_PROJECT_DIR")
        if [ "$RESIDOO_FAIL_ON_FIND" = "true" ]; then
          args+=(--fail-on-find)
        fi
        residoo "${args[@]}"
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
    - name: Produce SARIF
      if: inputs.sarif == 'true'
      shell: bash
      env:
        RESIDOO_PROJECT_DIR: ${{ inputs.project-dir }}
      run: |
        set -euo pipefail
        residoo scan --project "$RESIDOO_PROJECT_DIR" --sarif > residoo-results.sarif
    - name: Upload SARIF to GitHub code scanning
      if: inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: residoo-results.sarif
    - name: Apply scan result
      shell: bash
      # Deferred to here, after the SARIF upload above, so --fail-on-find
      # still fails the job exactly as before, just not before the
      # findings had a chance to reach the Security tab.
      run: exit "${{ steps.residoo.outputs.exit_code }}"
