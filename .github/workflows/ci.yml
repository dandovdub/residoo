# Runs on every push and PR: syntax-check everything, then the smoke tests
# and the fuzz properties, across every supported Node line. No secrets, no
# tokens, nothing to steal. Zero RUNTIME dependencies still holds (see
# package.json's "files" allowlist, which never includes tests/) --
# fast-check is a devDependency used only by tests/fuzz.js, confirmed to
# have no install/postinstall/preinstall lifecycle scripts of its own
# before it was added, and neither does its one transitive dependency
# (pure-rand).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Syntax-check every source file
        run: |
          for f in src/*.js src/sources/*.js bin/residoo.js tests/smoke.js tests/fuzz.js; do
            node --check "$f"
          done
      - run: npm test
      - name: Fuzz properties (fast-check)
        run: npm run fuzz
      - name: CLI help renders
        run: node bin/residoo.js --help
