# Runs on every push and PR: syntax-check everything, then the smoke tests,
# across every supported Node line. No secrets, no tokens, nothing to steal —
# and dependency lifecycle scripts can't run because there are no dependencies.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Syntax-check every source file
        run: |
          for f in src/*.js src/sources/*.js bin/residoo.js tests/smoke.js; do
            node --check "$f"
          done
      - run: npm test
      - name: CLI help renders
        run: node bin/residoo.js --help
