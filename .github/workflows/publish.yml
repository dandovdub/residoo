# Publishes to npm via Trusted Publishing (OIDC) — no NPM_TOKEN secret exists
# anywhere in this repo or its settings, by design. npm mints a short-lived,
# workflow-scoped credential for this exact run instead of trusting a
# long-lived token that could sit in a maintainer's shell history or leak
# from a compromised laptop. Requires configuring this repo + this workflow
# filename as the registered trusted publisher on npmjs.com for the
# `residoo` package before the first run — see docs.npmjs.com/trusted-publishers.
#
# Triggered by pushing a version tag (`git tag v0.2.0 && git push --tags`),
# not by every push to main — a release stays a deliberate, human action.
name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing — nothing else needs it

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm 11.5+; Node 20 ships npm 10.x,
      # which fails auth silently-tokenless. Pinned to an exact version,
      # not a floating major tag, so a future npm release can't land in
      # this release pipeline unreviewed (Scorecard's Pinned-Dependencies
      # check, same reasoning as the SHA-pinned Actions above). Unlike
      # those, Dependabot does not parse a version inside a shell `run:`
      # command, so this one needs a human to bump it occasionally --
      # stated here rather than left to silently go stale unnoticed.
      #
      # This is the practical ceiling, not an oversight: Scorecard's
      # check technically wants a HASH, not just an exact version, but
      # npm itself has no practical hash-pinning syntax for a plain
      # global CLI install (a known, community-acknowledged tooling gap:
      # ossf/scorecard#1754). The only literal workaround is manually
      # downloading the npm tarball and verifying its checksum by hand,
      # which is more fragile CI logic for marginal extra protection over
      # an exact-version pin -- that pin already blocks the actual threat
      # (an unreviewed future npm release landing silently); a checksum
      # would only additionally guard against the registry response for
      # THIS exact version being tampered with in flight, already covered
      # by TLS to registry.npmjs.org. Not worth the fragility.
      - run: npm install -g npm@11.19.1

      # Zero dependencies means there's nothing to install, but `npm ci`
      # still validates package.json/lockfile integrity before we publish.
      - run: npm ci

      - run: node bin/residoo.js --help # smoke test: the CLI must at least run

      # actions/setup-node's registry-url input writes an EMPTY
      # "_authToken=" line into .npmrc even when NODE_AUTH_TOKEN is unset
      # (a known upstream issue: actions/setup-node#1551). npm then tries
      # that blank token for the actual publish instead of relying purely
      # on the OIDC exchange this workflow is built around, and fails with
      # a 401 "token is invalid" that has nothing to do with OIDC itself
      # being broken. Stripping the line is the documented workaround.
      - run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"

      - run: npm publish --provenance
