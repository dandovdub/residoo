# Publishes to npm via Trusted Publishing (OIDC) — no NPM_TOKEN secret exists
# anywhere in this repo or its settings, by design. npm mints a short-lived,
# workflow-scoped credential for this exact run instead of trusting a
# long-lived token that could sit in a maintainer's shell history or leak
# from a compromised laptop. Requires configuring this repo + this workflow
# filename as the registered trusted publisher on npmjs.com for the
# `residoo` package before the first run — see docs.npmjs.com/trusted-publishers.
#
# Triggered by pushing a version tag (`git tag v0.2.0 && git push --tags`),
# not by every push to main — a release stays a deliberate, human action.
name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # contents: write only at job level, not the workflow-level default
    # above -- least privilege, and it's what Scorecard's Token-Permissions
    # check itself wants structurally (a workflow-level write grant applies
    # to every job in the file, including any added later that doesn't
    # need it), same reasoning as test-sarif.yml's existing job-level scope.
    permissions:
      contents: write # creates the GitHub Release + uploads provenance assets below
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm 11.5+; Node 20 ships npm 10.x,
      # which fails auth silently-tokenless. Pinned to an exact version,
      # not a floating major tag, so a future npm release can't land in
      # this release pipeline unreviewed (Scorecard's Pinned-Dependencies
      # check, same reasoning as the SHA-pinned Actions above). Unlike
      # those, Dependabot does not parse a version inside a shell `run:`
      # command, so this one needs a human to bump it occasionally --
      # stated here rather than left to silently go stale unnoticed.
      #
      # This is the practical ceiling, not an oversight: Scorecard's
      # check technically wants a HASH, not just an exact version, but
      # npm itself has no practical hash-pinning syntax for a plain
      # global CLI install (a known, community-acknowledged tooling gap:
      # ossf/scorecard#1754). The only literal workaround is manually
      # downloading the npm tarball and verifying its checksum by hand,
      # which is more fragile CI logic for marginal extra protection over
      # an exact-version pin -- that pin already blocks the actual threat
      # (an unreviewed future npm release landing silently); a checksum
      # would only additionally guard against the registry response for
      # THIS exact version being tampered with in flight, already covered
      # by TLS to registry.npmjs.org. Not worth the fragility.
      - run: npm install -g npm@11.19.1

      # Zero dependencies means there's nothing to install, but `npm ci`
      # still validates package.json/lockfile integrity before we publish.
      - run: npm ci

      - run: node bin/residoo.js --help # smoke test: the CLI must at least run

      # actions/setup-node's registry-url input writes an EMPTY
      # "_authToken=" line into .npmrc even when NODE_AUTH_TOKEN is unset
      # (a known upstream issue: actions/setup-node#1551). npm then tries
      # that blank token for the actual publish instead of relying purely
      # on the OIDC exchange this workflow is built around, and fails with
      # a 401 "token is invalid" that has nothing to do with OIDC itself
      # being broken. Stripping the line is the documented workaround.
      - run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"

      - run: npm publish --provenance

      # OpenSSF Scorecard's Signed-Releases check looks for a real signed
      # artifact attached to the GitHub Release itself, not just npm's own
      # provenance (which it doesn't know how to find). `npm publish
      # --provenance` above already generated a real Sigstore-signed SLSA
      # provenance attestation and an npm-publish attestation; this just
      # fetches both from the registry (their public, permanent home) and
      # republishes them where Scorecard actually looks. Named .intoto.jsonl
      # / .sigstore.json to match the file patterns Scorecard's detector
      # recognizes (see docs/checks.md#signed-releases) -- both are already
      # real Sigstore bundles, not reformatted or re-signed here.
      - name: Attach npm's provenance attestation to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          # Retry budget found too short by a real failure (v0.8.3): 5x10s
          # wasn't enough, indexing took longer than 50s that run. 15x15s
          # (3.75min) is a generous margin over that one observed data
          # point, not a guess. Prints the HTTP status on each miss (curl
          # -f alone swallows it) so a future failure is diagnosable from
          # the log instead of a bare "file not found" from the next step.
          ok=""
          for i in $(seq 1 15); do
            status="$(curl -s -o /tmp/attestations.json -w '%{http_code}' "https://registry.npmjs.org/-/npm/v1/attestations/residoo@${version}")"
            if [ "$status" = "200" ]; then ok=1; break; fi
            echo "attestation not indexed yet (HTTP $status), retrying in 15s ($i/15)..."
            sleep 15
          done
          if [ -z "$ok" ]; then
            echo "::warning::npm attestation never became available for residoo@${version} after 15 retries; skipping the GitHub Release provenance attachment for this run. npm's own publish already succeeded and is unaffected -- backfill manually later with: curl -s https://registry.npmjs.org/-/npm/v1/attestations/residoo@${version}"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/tmp/attestations.json', 'utf-8'));
            for (const a of d.attestations) {
              if (a.predicateType === 'https://slsa.dev/provenance/v1') {
                fs.writeFileSync('/tmp/residoo-${version}.intoto.jsonl', JSON.stringify(a.bundle));
              }
              if (a.predicateType.includes('npm/attestation')) {
                fs.writeFileSync('/tmp/residoo-${version}.sigstore.json', JSON.stringify(a.bundle));
              }
            }
          "
          gh release create "$tag" --title "$tag" --generate-notes --repo "${GITHUB_REPOSITORY}" || true
          gh release upload "$tag" "/tmp/residoo-${version}.intoto.jsonl" "/tmp/residoo-${version}.sigstore.json" \
            --repo "${GITHUB_REPOSITORY}" --clobber
