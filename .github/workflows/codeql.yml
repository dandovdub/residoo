# CodeQL static analysis: GitHub's own SAST scanner, free for public repos.
# This is what OpenSSF Scorecard's SAST check looks for (see scorecards.yml
# for what that check is and why it's run at all); without a wired-in static
# analysis tool that check scores 0 regardless of how careful the code
# actually is. Standard GitHub-generated setup for a JavaScript-only repo,
# same "copy the reference workflow rather than hand-roll it" reasoning as
# scorecards.yml: https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Sundays, offset from Scorecard's own Saturday run.
    - cron: '30 1 * * 0'

# Top-level default, restrictive on its own (defense in depth, not just the
# job-level grant below): if a future job gets added to this file without
# its own explicit block, it inherits read-only rather than an implicit
# broader default.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:javascript-typescript"
